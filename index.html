<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>document</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
  </head>
  <body>
   <a-scene>
    <!--camara-->
		
		<a-camera position="0 1.6 0" wasd-controls look-controls><a-cursor></a-cursor></a-camera>
		
    <!--modelos 3d-->

<!--===============CASAS==================-->
<a-gltf-model src="casa_opt.glb" id="casa1" position="2 1 0 " scale="0.02 0.02 0.02" rotation="0 180 0"></a-gltf-model>
<a-gltf-model src="tienda_opt.glb" id="super" position="4 0 -6 " scale="0.004 0.004 0.004" rotation="0 60 0 "></a-gltf-model>
<a-gltf-model src="casa verde_opt.glb" id="mi casa" position="4 0 3 " scale="0.1 0.1 0.1" rotation="0 130 0"></a-gltf-model>
<a-gltf-model src="casa nieve_opt.glb" id="nieve casa" position="5 0 5 " scale="0.3 0.3 0.3" rotation="0 130 0"></a-gltf-model>

<a-gltf-model src="arbol_opt.glb" id="arbol1" position="-17 0 -22 " scale="0.6 0.6 0.6" rotation="0 130 0"></a-gltf-model>
<a-gltf-model src="arbol_opt.glb" id="arbol2" position="-10 -0.29655 -19.37875" scale="0.6 0.6 0.6" rotation="0 130 0"></a-gltf-model>
<a-gltf-model src="arbol_opt.glb" id="arbol3" position="-6 -0.32477 -27.94113" scale="0.6 0.6 0.6" rotation="0 130 0"></a-gltf-model>
<a-gltf-model src="montain_opt.glb" id="montaña" position="-5 5 -5 " scale="7 7 7" rotation="0 80 0"></a-gltf-model>
		<!--meme-->
<a-gltf-model 
  src="pepe_opt.glb" id="meme" position="2 4 4" scale="11 11 11" rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 500; easing: linear" sound="src: #musica; on:mouseenter ">
</a-gltf-model>
		
<a-assets> <a-sound id="musica" src="cancion.mp3"></a-sound></a-assets>

		<!--===============SUELO==================-->

<a-gltf-model src="suelo_opt.glb" id="suelo" position="0 -0.1 0 " scale="0.01 0.01 0.01" rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 1000000; easing: linear" ></a-gltf-model>

  <!-- cielo girando lento -->
  <a-gltf-model 
    src="sky_opt.glb" id="cielo" position="0 0 0" scale="1 1 1" rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 100000; easing: linear">
  </a-gltf-model>
		
		
		<!--cartel-->
		
		
<a-box position="2 3 4" rotation="90 90 90" height="1.5" color="black" event-set__enter="_event: mouseenter; _target: #boxText; visible: true" event-set__leave="_event: mouseleave; _target: #boxText; visible: false">
 <a-text id="boxText" value="Estatua del dios supremo" align="center" color="BLACK" visible="true" rotation="0 90 -90" position="1.5 -0.8 0" geometry="primitive: plane; width: 3" material="white"
 ></a-text></a-box>
	   
	   
	   <a-link id="miEnlace1" href="https://carlatienzam-byte.github.io/EPE-IESCarmen-de-Burgos-Segui/" title="Backrooms" position="-6.29221 1.88346 4.77171" scale="0.5 0.5 0.5" geometry="primitive: circle; segments: 64" material="shader: portal; side: double; previewDistance: 7.5"><a-entity text="align: center; color: white; font: kelsonsans; value: Backrooms; width: 5" position="0 1.5 0" rotation="0 180 0"></a-entity></a-link>
	

    </a-scene>
	  <script>
document.querySelector('#miEnlace1').addEventListener('click', function () {
    window.location.href ='https://carlatienzam-byte.github.io/EPE-IESCarmen-de-Burgos-Segui/';
});
		
		</script>	
  </body>
</html>
